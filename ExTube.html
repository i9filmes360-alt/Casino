<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Limpo Oficial - YouTube (Fix Erro 153)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121212',
                        cardBg: '#1E1E1E',
                        accentRed: '#FF0000',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex flex-col items-center justify-start p-4">

    <div class="w-full max-w-4xl bg-cardBg border border-neutral-800 rounded-xl p-6 shadow-2xl space-y-6">
        <h1 class="text-xl font-bold tracking-wide text-white flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-red-600 inline-block animate-pulse"></span>
            Extrator & Player Oficial YouTube (Fix Definitivo Erro 153)
        </h1>

        <!-- Input URL -->
        <div class="space-y-2">
            <label class="text-xs font-semibold uppercase text-neutral-400 tracking-wider">URL do YouTube ou ID do Vídeo</label>
            <div class="flex gap-2">
                <input type="text" id="urlInput" placeholder="Ex: https://www.youtube.com/watch?v=XXXXX ou ID" 
                    class="flex-1 bg-neutral-900 border border-neutral-700 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-red-600 transition"
                    oninput="processYouTubeUrl()">
                <button onclick="clearInput()" class="bg-neutral-800 hover:bg-neutral-700 text-neutral-300 px-4 py-3 rounded-lg text-sm transition">Limpar</button>
            </div>
        </div>

        <!-- Código HTML para o seu Player Unificado / i9tv -->
        <div class="space-y-2">
            <label class="text-xs font-semibold uppercase text-neutral-400 tracking-wider">Snippet HTML/JS para o seu Player Unificado</label>
            <div class="flex gap-2">
                <input type="text" id="embedOutput" readonly 
                    class="flex-1 bg-neutral-900 border border-neutral-700 rounded-lg px-4 py-2 text-sm font-mono text-neutral-300 focus:outline-none">
                <button onclick="copyEmbedCode()" class="bg-red-600 hover:bg-red-700 text-white font-medium px-5 py-2 rounded-lg text-sm transition shadow-lg shadow-red-900/20">Copiar Snippet</button>
            </div>
        </div>

        <!-- Preview do Player via API Oficial -->
        <div class="space-y-2">
            <label class="text-xs font-semibold uppercase text-neutral-400 tracking-wider">Preview do Player Limpo (API Oficial)</label>
            <div id="playerContainer" class="w-full aspect-video bg-neutral-950 rounded-xl overflow-hidden border border-neutral-800 flex items-center justify-center text-neutral-600 text-sm">
                Cole um link do YouTube acima para iniciar o player
            </div>
        </div>
    </div>

    <!-- Carrega a API oficial do YouTube IFrame Player -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let player = null;

        function extractVideoId(url) {
            if (!url) return '';
            url = url.trim();
            if (/^[a-zA-Z0-9_-]{11}$/.test(url)) {
                return url;
            }
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function processYouTubeUrl() {
            const input = document.getElementById('urlInput').value;
            const output = document.getElementById('embedOutput');
            const container = document.getElementById('playerContainer');

            const videoId = extractVideoId(input);

            if (!videoId) {
                output.value = '';
                container.innerHTML = 'Cole um link válido do YouTube';
                if (player) {
                    player.destroy();
                    player = null;
                }
                return;
            }

            // Gera o snippet limpo para uso em aplicações
            output.value = `<div id="yt-player"></div><script src="https://www.youtube.com/iframe_api"><\/script><script>let p; function onYouTubeIframeAPIReady(){p=new YT.Player('yt-player',{videoId:'${videoId}',playerVars:{autoplay:1,controls:1,modestbranding:1,rel:0}})}<\/script>`;

            // Prepara o container para a API
            container.innerHTML = '<div id="yt-iframe-preview" class="w-full h-full"></div>';

            // Se a API já estiver carregada, instancia o player imediatamente
            if (window.YT && window.YT.Player) {
                initPlayer(videoId);
            }
        }

        function initPlayer(videoId) {
            if (player) {
                player.loadVideoById(videoId);
                return;
            }
            player = new YT.Player('yt-iframe-preview', {
                videoId: videoId,
                width: '100%',
                height: '100%',
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,
                    'rel': 0,
                    'modestbranding': 1
                },
                events: {
                    'onError': (e) => {
                        console.error("Erro no player do YouTube:", e.data);
                        alert("Erro no player do YouTube código: " + e.data + ". Verifique se o vídeo permite incorporação.");
                    }
                }
            });
        }

        // Função global exigida pela API do YouTube
        window.onYouTubeIframeAPIReady = function() {
            const input = document.getElementById('urlInput').value;
            const videoId = extractVideoId(input);
            if (videoId) {
                initPlayer(videoId);
            }
        };

        function copyEmbedCode() {
            const output = document.getElementById('embedOutput');
            if (!output.value) return;
            navigator.clipboard.writeText(output.value);
            event.target.textContent = 'Copiado!';
            setTimeout(() => { event.target.textContent = 'Copiar Snippet'; }, 2000);
        }

        function clearInput() {
            document.getElementById('urlInput').value = '';
            document.getElementById('embedOutput').value = '';
            document.getElementById('playerContainer').innerHTML = 'Cole um link do YouTube acima para iniciar o player';
            if (player) {
                player.destroy();
                player = null;
            }
        }
    </script>
</body>
</html>
