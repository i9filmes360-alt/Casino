<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>i9tv</title>
<!-- BIBLIOTECA HLS.JS PARA REPRODUZIR LINKS .M3U8 -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  :root{
    --bg:#080a10;
    --sidebar-bg:#10141f;
    --line:#222a3b;
    --txt:#e8ecf6;
    --muted:#8b95ad;
    --accent:#7c5cff;
    --accent2:#00d8b4;
    --danger:#ff4757;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif;
    color: var(--txt);
    background: var(--bg);
  }

  .layout {
    display: flex;
    height: 100vh;
    height: 100dvh;
  }

  .sidebar {
    width: 380px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
  }

  .brand {
    padding: 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand-title { display: flex; align-items: center; gap: 10px; }
  .brand .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 0 15px var(--accent);
  }
  .brand h1 { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
  .brand h1 span {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; color: transparent;
  }

  /* BOTÃO ADICIONAR CANAL */
  .btn-add-channel {
    background: rgba(124,92,255,0.15);
    color: var(--accent);
    border: 1px solid rgba(124,92,255,0.3);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .btn-add-channel:hover {
    background: var(--accent);
    color: #fff;
    border-color: transparent;
  }

  .categories-section {
    flex: 0 0 auto;
    max-height: 40%;
    display: flex;
    flex-direction: column;
    border-bottom: 1px solid var(--line);
  }

  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    color: var(--muted);
    letter-spacing: 1px;
    padding: 12px 16px 4px;
    font-weight: 700;
  }

  .tabs {
    flex: 1;
    overflow-y: auto;
    padding: 0 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .tabs::-webkit-scrollbar { width: 4px; }
  .tabs::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .tab {
    padding: 10px 14px;
    border-radius: 8px;
    text-align: left;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    background: transparent;
    border: 1px solid transparent;
    transition: 0.2s;
  }
  .tab:hover { background: rgba(255,255,255,0.03); color: #fff; }
  .tab.active {
    background: rgba(124,92,255,0.15);
    color: var(--accent);
    border-color: rgba(124,92,255,0.3);
  }

  .channels-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .channels-container {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px 12px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 8px;
    align-content: start;
  }
  
  .channels-container::-webkit-scrollbar { width: 4px; }
  .channels-container::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .ch-card {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 10px 6px; border-radius: 10px; text-align: center;
    background: rgba(255,255,255,0.03); border: 1px solid var(--line);
    cursor: pointer; transition: 0.2s; position: relative;
  }
  .ch-card:hover {
    background: rgba(255,255,255,0.06); border-color: rgba(124,92,255,0.5); transform: translateY(-2px);
  }
  .ch-card.active {
    border-color: var(--accent2); background: rgba(0, 216, 180, 0.1);
  }

  /* BOTÕES DE AÇÃO NO CARD (EDITAR E APAGAR) */
  .ch-card-actions {
    position: absolute; top: 4px; right: 4px;
    display: none; gap: 2px; z-index: 10;
  }
  .ch-card:hover .ch-card-actions { display: flex; }
  
  .btn-action {
    background: rgba(0,0,0,0.7); color: #fff;
    border: none; border-radius: 4px; padding: 3px 5px;
    font-size: 10px; cursor: pointer; transition: 0.2s;
  }
  .btn-action:hover { background: var(--accent); }
  .btn-action.delete:hover { background: var(--danger); }

  .ch-logo-wrapper {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.9); 
    padding: 4px;
    overflow: hidden;
  }

  .ch-logo-img {
    width: 100%; height: 100%;
    object-fit: contain;
  }

  .ch-logo-fallback {
    width: 44px; height: 44px; border-radius: 8px;
    display: none; 
    place-items: center;
    font-size: 14px; font-weight: 900; color: #000;
    background: linear-gradient(140deg, hsl(var(--h) 82% 60%), hsl(calc(var(--h) + 45) 82% 48%));
  }

  .ch-name {
    font-size: 10px; font-weight: 600; color: #aeb8cf;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 24px;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #101424 0%, var(--bg) 100%);
  }

  .player-wrapper {
    width: 100%;
    max-width: 1100px;
    display: flex;
    flex-direction: column;
    transition: 0.3s;
    position: relative;
  }

  .player-frame {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 12px 12px 0 0;
    overflow: hidden;
    box-shadow: 0 15px 50px rgba(0,0,0,0.8);
    position: relative;
  }

  #playerIframe, #playerVideo {
    width: 100%; height: 100%; border: 0; display: block; position: absolute; top: 0; left: 0;
  }

  .edge-tap {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    height: 120px;
    width: 20px;
    z-index: 999;
    cursor: pointer;
    background: transparent;
    border-radius: 4px;
    touch-action: none;
  }
  .edge-tap.left { left: 0; }
  .edge-tap.right { right: 0; }
  
  .edge-tap:active {
    background: rgba(255, 255, 255, 0.3);
  }

  .player-wrapper:fullscreen {
    max-width: 100%;
    width: 100vw;
    height: 100vh;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .player-wrapper:fullscreen .player-frame {
    height: 100%;
    width: 100%;
    aspect-ratio: auto;
    border-radius: 0;
  }
  .player-wrapper:fullscreen .player-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(18, 23, 36, 0.85);
    backdrop-filter: blur(10px);
    border: none;
    border-radius: 0;
    z-index: 1000;
  }

  .player-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: #121724;
    border-radius: 0 0 12px 12px;
    border: 1px solid var(--line);
    border-top: none;
    transition: 0.3s;
  }

  .nav-btn {
    width: 46px; height: 46px; border-radius: 12px;
    display: grid; place-items: center;
    font-size: 24px; font-weight: bold; color: #fff;
    cursor: pointer; background: rgba(255,255,255,0.05);
    border: 1px solid var(--line); transition: 0.2s;
  }
  .nav-btn:hover { background: var(--accent); border-color: transparent; }
  .nav-btn:active { transform: scale(0.95); }

  .now-playing {
    text-align: center; flex: 1; padding: 0 10px;
  }
  .now-cat {
    font-size: 11px; color: var(--accent2); text-transform: uppercase; letter-spacing: 1px; font-weight: bold; margin-bottom: 2px; display: block;
  }
  .now-name {
    font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;
  }

  .counter {
    font-size: 12px; color: var(--muted); background: rgba(255,255,255,0.05);
    padding: 6px 12px; border-radius: 20px; border: 1px solid var(--line);
  }

  /* =========================================
     ESTILOS DOS MODAIS (ADICIONAR E EDITAR)
     ========================================= */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    backdrop-filter: blur(5px); z-index: 10000;
    display: none; justify-content: center; align-items: center;
  }
  .modal-overlay.show { display: flex; }
  
  .modal-box {
    background: #121724; border: 1px solid var(--line);
    border-radius: 12px; padding: 24px; width: 100%; max-width: 420px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .modal-box h2 { margin-bottom: 16px; font-size: 18px; color: var(--accent); }
  .modal-box label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; margin-top: 10px; }
  .modal-box input, .modal-box select {
    width: 100%; padding: 10px; border-radius: 8px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--line);
    color: #fff; font-size: 14px; outline: none; margin-bottom: 10px;
  }
  .modal-box input:focus { border-color: var(--accent); }
  
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .btn-modal { padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
  .btn-cancel { background: rgba(255,255,255,0.1); color: #fff; }
  .btn-cancel:hover { background: rgba(255,255,255,0.2); }
  .btn-confirm { background: var(--accent); color: #fff; }
  .btn-confirm:hover { background: #5b3cff; }

  @media (max-width: 850px) {
    .layout { flex-direction: column; }
    .main-content { order: 1; padding: 10px; flex: none; background: var(--bg); }
    .player-wrapper { max-width: 100%; }
    .player-bar { padding: 8px 12px; gap: 4px; }
    .nav-btn { width: 36px; height: 36px; font-size: 18px; }
    .now-playing .now-name { font-size: 14px; }
    .now-playing .now-cat { font-size: 9px; }
    .counter { display: none; }

    .sidebar { order: 2; width: 100%; flex: 1; border-right: none; border-top: 1px solid var(--line); overflow: hidden; }
    .brand { display: none; }
    .categories-section { max-height: none; border-bottom: none; }
    .section-title { display: none; }

    .tabs { flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 10px; gap: 8px; border-bottom: 1px solid var(--line); }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { white-space: nowrap; padding: 8px 16px; border-radius: 20px; font-size: 13px; }

    .channels-section { flex: 1; overflow: hidden; }
    .channels-container { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); padding: 10px; gap: 8px; }
    .ch-logo-wrapper { width: 38px; height: 38px; padding: 3px; }
    .ch-logo-fallback { width: 38px; height: 38px; font-size: 12px; }
    .ch-name { font-size: 9px; }

    .edge-tap { width: 15px; }
    .ch-card-actions { display: flex; opacity: 0.7; } /* Mostra no celular também */
  }
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-title">
        <div class="dot"></div>
        <h1><span>i9</span>tv</h1>
      </div>
      <button class="btn-add-channel" onclick="abrirSenha('add')">➕ Inserir Canal</button>
    </div>
    <div class="categories-section">
      <div class="section-title">Categorias</div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="channels-section">
      <div class="section-title" id="channelSectionTitle">Canais</div>
      <div class="channels-container" id="channelsContainer"></div>
    </div>
  </aside>

  <main class="main-content">
    <div class="player-wrapper" id="playerWrapper">
      <div class="player-frame">
        <iframe id="playerIframe" src="about:blank" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        <video id="playerVideo" controls autoplay playsinline style="display: none; background: #000; object-fit: contain;"></video>
        
        <div class="edge-tap left" id="tapPrev" title="Canal Anterior"></div>
        <div class="edge-tap right" id="tapNext" title="Próximo Canal"></div>
      </div>
      
      <div class="player-bar" id="playerBar">
        <button class="nav-btn" id="prevBtn" title="Canal Anterior">−</button>
        <div class="now-playing">
          <span class="now-cat" id="nowCat">...</span>
          <span class="now-name" id="nowName">...</span>
        </div>
        <span class="counter" id="counter">0 / 0</span>
        <button class="nav-btn" id="fsBtn" title="Tela Cheia" style="font-size: 16px;">⛶</button>
        <button class="nav-btn" id="nextBtn" title="Próximo Canal">+</button>
      </div>
    </div>
  </main>
</div>

<!-- MODAL DE SENHA -->
<div class="modal-overlay" id="modalSenha">
  <div class="modal-box">
    <h2>🔒 Acesso Restrito</h2>
    <label>Digite a senha para continuar:</label>
    <input type="password" id="inputSenha" placeholder="Senha..." onkeypress="if(event.key==='Enter') verificarSenha()">
    <div class="modal-actions">
      <button class="btn-modal btn-cancel" onclick="fecharSenha()">Cancelar</button>
      <button class="btn-modal btn-confirm" onclick="verificarSenha()">Confirmar</button>
    </div>
  </div>
</div>

<!-- MODAL DE ADICIONAR / EDITAR CANAL -->
<div class="modal-overlay" id="modalCanal">
  <div class="modal-box">
    <h2 id="modalCanalTitle">📺 Adicionar Novo Canal</h2>
    
    <!-- Campos ocultos para modo de edição -->
    <input type="hidden" id="editCatIdx" value="-1">
    <input type="hidden" id="editChanIdx" value="-1">

    <label>Nome do Canal</label>
    <input type="text" id="inputNome" placeholder="Ex: Meu Canal Favorito">
    
    <label>URL do Stream (.m3u8 ou iframe)</label>
    <input type="text" id="inputUrl" placeholder="https://...">
    
    <label>Categoria</label>
    <input type="text" id="inputCategoria" list="listaCategorias" placeholder="Digite ou selecione...">
    <datalist id="listaCategorias"></datalist>
    
    <label>URL da Logo</label>
    <input type="text" id="inputLogo" placeholder="https://.../logo.png">
    
    <div class="modal-actions">
      <button class="btn-modal btn-cancel" onclick="fecharCanal()">Cancelar</button>
      <button class="btn-modal btn-confirm" onclick="salvarCanal()">Salvar Canal</button>
    </div>
  </div>
</div>

<script>

<script>
// ==========================================
// SISTEMA DE ADICIONAR / EDITAR CANAIS
// ==========================================
const SENHA_CORRETA = "bpa6tfor";
let acaoPendente = "add"; // 'add' ou 'edit'
let canalParaEditar = { catIdx: -1, chanIdx: -1 };

function abrirSenha(acao) {
  acaoPendente = acao;
  document.getElementById('modalSenha').classList.add('show');
  document.getElementById('inputSenha').value = '';
  setTimeout(() => document.getElementById('inputSenha').focus(), 100);
}

function fecharSenha() {
  document.getElementById('modalSenha').classList.remove('show');
}

function verificarSenha() {
  const senha = document.getElementById('inputSenha').value;
  if (senha === SENHA_CORRETA) {
    fecharSenha();
    if (acaoPendente === 'add') {
      abrirModalCanal();
    } else {
      abrirModalEdicao();
    }
  } else {
    alert("Senha incorreta!");
  }
}

function abrirSenhaEdicao(catIdx, chanIdx) {
  canalParaEditar = { catIdx, chanIdx };
  abrirSenha('edit');
}

// Preenche o modal para adicionar
function abrirModalCanal() {
  document.getElementById('modalCanalTitle').textContent = "📺 Adicionar Novo Canal";
  document.getElementById('editCatIdx').value = "-1";
  document.getElementById('editChanIdx').value = "-1";
  
  // Preencher categorias no datalist
  const datalist = document.getElementById('listaCategorias');
  datalist.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat.name;
    datalist.appendChild(opt);
  });

  document.getElementById('modalCanal').classList.add('show');
  document.getElementById('inputNome').value = '';
  document.getElementById('inputUrl').value = '';
  document.getElementById('inputCategoria').value = '';
  document.getElementById('inputLogo').value = '';
  setTimeout(() => document.getElementById('inputNome').focus(), 100);
}

// Preenche o modal para edição
function abrirModalEdicao() {
  const { catIdx, chanIdx } = canalParaEditar;
  const cat = CATEGORIES[catIdx];
  const ch = cat.channels[chanIdx];

  document.getElementById('modalCanalTitle').textContent = "✏️ Editar Canal";
  document.getElementById('editCatIdx').value = catIdx;
  document.getElementById('editChanIdx').value = chanIdx;

  // Preencher categorias no datalist
  const datalist = document.getElementById('listaCategorias');
  datalist.innerHTML = '';
  CATEGORIES.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.name;
    datalist.appendChild(opt);
  });

  document.getElementById('modalCanal').classList.add('show');
  document.getElementById('inputNome').value = ch[1];
  document.getElementById('inputUrl').value = ch[0];
  document.getElementById('inputCategoria').value = cat.name;
  document.getElementById('inputLogo').value = ch[2] || '';
}

function fecharCanal() {
  document.getElementById('modalCanal').classList.remove('show');
}

function salvarCanal() {
  const nome = document.getElementById('inputNome').value.trim();
  const url = document.getElementById('inputUrl').value.trim();
  const categoria = document.getElementById('inputCategoria').value.trim();
  const logo = document.getElementById('inputLogo').value.trim();
  const editCatIdx = parseInt(document.getElementById('editCatIdx').value);
  const editChanIdx = parseInt(document.getElementById('editChanIdx').value);

  if (!nome || !url || !categoria) {
    alert("Por favor, preencha o Nome, a URL e a Categoria.");
    return;
  }

  const logoFinal = logo || "https://i.imgur.com/eXwJ5wK.png"; // Logo padrão se ficar em branco

  if (editCatIdx !== -1 && editChanIdx !== -1) {
    // MODO EDIÇÃO
    const catAntiga = CATEGORIES[editCatIdx];
    const chanAntigo = catAntiga.channels[editChanIdx];
    
    // Verifica se mudou de categoria
    if (catAntiga.name.toLowerCase() === categoria.toLowerCase()) {
      // Mesma categoria: só atualiza os dados
      catAntiga.channels[editChanIdx] = [url, nome, logoFinal];
    } else {
      // Mudou de categoria: remove da antiga e adiciona na nova
      catAntiga.channels.splice(editChanIdx, 1);
      
      let novaCatIndex = CATEGORIES.findIndex(c => c.name.toLowerCase() === categoria.toLowerCase());
      if (novaCatIndex === -1) {
        CATEGORIES.push({ name: categoria, channels: [] });
        novaCatIndex = CATEGORIES.length - 1;
      }
      CATEGORIES[novaCatIndex].channels.push([url, nome, logoFinal]);
    }
    alert("Canal atualizado com sucesso!");
  } else {
    // MODO ADIÇÃO
    let catIndex = CATEGORIES.findIndex(c => c.name.toLowerCase() === categoria.toLowerCase());
    if (catIndex === -1) {
      CATEGORIES.push({ name: categoria, channels: [] });
      catIndex = CATEGORIES.length - 1;
    }
    CATEGORIES[catIndex].channels.push([url, nome, logoFinal]);
    alert("Canal adicionado com sucesso!");
  }

  salvarCanaisLocais();
  rebuildALL();
  renderTabs();
  
  // Vai para a categoria onde o canal foi salvo
  let finalCatIndex = CATEGORIES.findIndex(c => c.name.toLowerCase() === categoria.toLowerCase());
  playChannel(finalCatIndex, CATEGORIES[finalCatIndex].channels.length - 1);
  
  fecharCanal();
}

function salvarCanaisLocais() {
  localStorage.setItem('i9tv_canais_custom', JSON.stringify(CATEGORIES));
}

function removerCanal(event, catIdx, chanIdx) {
  event.stopPropagation();
  if (confirm("Tem certeza que deseja remover este canal?")) {
    CATEGORIES[catIdx].channels.splice(chanIdx, 1);
    salvarCanaisLocais();
    rebuildALL();
    renderTabs();
    
    if (currentCatIndex === catIdx) {
      playChannel(catIdx, 0);
    }
  }
}

// Carregar canais customizados salvos anteriormente
const canaisSalvos = localStorage.getItem('i9tv_canais_custom');
if (canaisSalvos) {
  try {
    const parsed = JSON.parse(canaisSalvos);
    CATEGORIES = parsed;
  } catch (e) {
    console.error("Erro ao carregar canais salvos:", e);
  }
}

const BASE_URL = "https://rdcanais.org/";
const LOGO_BASE_URL = "https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/brazil/";

let currentCatIndex = 0;
let currentChanIndex = 0;
let hls = null;

const iframeEl = document.getElementById("playerIframe");
const videoEl = document.getElementById("playerVideo");
const nowName = document.getElementById("nowName");
const nowCat = document.getElementById("nowCat");
const counter = document.getElementById("counter");
const tabsEl = document.getElementById("tabs");
const channelsContainer = document.getElementById("channelsContainer");
const channelSectionTitle = document.getElementById("channelSectionTitle");
const playerWrapper = document.getElementById("playerWrapper");
const fsBtn = document.getElementById("fsBtn");

let ALL = [];
function rebuildALL() {
  ALL = [];
  CATEGORIES.forEach((cat, catIdx) => {
    cat.channels.forEach(([slug, name, logoSlug], chanIdx) => {
      ALL.push({ slug, name, category: cat.name, catIdx, chanIdx, logoSlug });
    });
  });
}

function renderTabs() {
  tabsEl.innerHTML = "";
  CATEGORIES.forEach((cat, idx) => {
    const btn = document.createElement("button");
    btn.className = "tab";
    btn.textContent = cat.name;
    btn.onclick = () => playChannel(idx, 0);
    tabsEl.appendChild(btn);
  });
}

function playChannel(catIdx, chanIdx) {
  if(catIdx < 0 || catIdx >= CATEGORIES.length) return;
  if(chanIdx < 0 || chanIdx >= CATEGORIES[catIdx].channels.length) return;

  currentCatIndex = catIdx;
  currentChanIndex = chanIdx;
  
  const cat = CATEGORIES[catIdx];
  const ch = cat.channels[chanIdx];
  
  let streamUrl = ch[0];
  if (!streamUrl.startsWith('http')) {
    streamUrl = BASE_URL + streamUrl;
  }
  
  nowCat.textContent = cat.name;
  nowName.textContent = ch[1];
  
  const globalIndex = ALL.findIndex(c => c.slug === ch[0]);
  counter.textContent = (globalIndex + 1) + " / " + ALL.length;

  document.querySelectorAll(".tab").forEach((btn, idx) => {
    btn.classList.toggle("active", idx === catIdx);
  });

  channelSectionTitle.textContent = `Canais: ${cat.name}`;

  if (hls) {
    hls.destroy();
    hls = null;
  }
  
  if (streamUrl.includes('.m3u8')) {
    iframeEl.style.display = 'none';
    iframeEl.src = 'about:blank';
    videoEl.style.display = 'block';
    videoEl.src = '';
    
    if (Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(streamUrl);
      hls.attachMedia(videoEl);
      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        videoEl.play().catch(e => console.log("Erro ao dar play:", e));
      });
    } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
      videoEl.src = streamUrl;
      videoEl.addEventListener('loadedmetadata', function() {
        videoEl.play().catch(e => console.log("Erro ao dar play:", e));
      }, { once: true });
    }
  } else {
    videoEl.style.display = 'none';
    videoEl.pause();
    videoEl.src = '';
    iframeEl.style.display = 'block';
    iframeEl.src = streamUrl;
  }

  renderChannels(catIdx, ch[0]);
}

function renderChannels(catIdx, activeSlug) {
  channelsContainer.innerHTML = "";
  const cat = CATEGORIES[catIdx];

  cat.channels.forEach(([slug, name, logoSlug], chanIdx) => {
    const card = document.createElement("div");
    card.className = "ch-card" + (slug === activeSlug ? " active" : "");
    
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
    const initials = name.substring(0, 2).toUpperCase();
    
    let logoUrl = logoSlug;
    if (!logoUrl.startsWith('http')) {
        logoUrl = LOGO_BASE_URL + logoSlug + "-br.png";
    }

    // Adiciona os botões de Editar (✏️) e Apagar (🗑️)
    card.innerHTML = `
      <div class="ch-card-actions">
        <button class="btn-action" onclick="abrirSenhaEdicao(${catIdx}, ${chanIdx})" title="Editar Canal">✏️</button>
        <button class="btn-action delete" onclick="removerCanal(event, ${catIdx}, ${chanIdx})" title="Apagar Canal">🗑️</button>
      </div>
      <div class="ch-logo-wrapper">
        <img src="${logoUrl}" class="ch-logo-img" alt="${name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';">
        <div class="ch-logo-fallback" style="--h:${h};">${initials}</div>
      </div>
      <div class="ch-name">${name}</div>
    `;
    
    card.onclick = (e) => {
      // Só toca o canal se não clicou nos botões de ação
      if(e.target.tagName !== 'BUTTON') {
        playChannel(catIdx, chanIdx);
      }
    };
    channelsContainer.appendChild(card);
  });
}

function nextChannel() {
  const cat = CATEGORIES[currentCatIndex];
  if (currentChanIndex < cat.channels.length - 1) {
    playChannel(currentCatIndex, currentChanIndex + 1);
  } else {
    playChannel((currentCatIndex + 1) % CATEGORIES.length, 0);
  }
}

function prevChannel() {
  if (currentChanIndex > 0) {
    playChannel(currentCatIndex, currentChanIndex - 1);
  } else {
    const prevCat = (currentCatIndex - 1 + CATEGORIES.length) % CATEGORIES.length;
    playChannel(prevCat, CATEGORIES[prevCat].channels.length - 1);
  }
}

document.getElementById("nextBtn").onclick = nextChannel;
document.getElementById("prevBtn").onclick = prevChannel;

document.getElementById("tapNext").onclick = nextChannel;
document.getElementById("tapPrev").onclick = prevChannel;

document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") nextChannel();
  if (e.key === "ArrowLeft") prevChannel();
});

fsBtn.onclick = () => {
  if (!document.fullscreenElement) {
    if (playerWrapper.requestFullscreen) playerWrapper.requestFullscreen();
    else if (playerWrapper.webkitRequestFullscreen) playerWrapper.webkitRequestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
};

document.addEventListener('fullscreenchange', () => {
  if (document.fullscreenElement) {
    fsBtn.innerHTML = '✖';
    fsBtn.title = "Sair da Tela Cheia";
  } else {
    fsBtn.innerHTML = '⛶';
    fsBtn.title = "Tela Cheia";
  }
});

let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;

document.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
  touchStartTime = Date.now();
}, { passive: true });

document.addEventListener('touchend', (e) => {
  const touchEndX = e.changedTouches[0].screenX;
  const touchEndY = e.changedTouches[0].screenY;
  const dx = touchEndX - touchStartX;
  const dy = touchEndY - touchStartY;
  const dt = Date.now() - touchStartTime;

  if (dt < 500 && Math.abs(dx) > 60 && Math.abs(dy) < 80) {
    if (dx < 0) nextChannel();
    else prevChannel();
  }
}, { passive: true });

// Inicialização
rebuildALL();
renderTabs();
playChannel(0, 0);
</script>
