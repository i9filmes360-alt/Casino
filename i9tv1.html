<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>i9tv</title>
<!-- BIBLIOTECA HLS.JS PARA REPRODUZIR LINKS .M3U8 -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  :root{
    --bg:#080a10;
    --sidebar-bg:#10141f;
    --line:#222a3b;
    --txt:#e8ecf6;
    --muted:#8b95ad;
    --accent:#7c5cff;
    --accent2:#00d8b4;
    --danger:#ff4757;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif;
    color: var(--txt);
    background: var(--bg);
  }

  .layout {
    display: flex;
    height: 100vh;
    height: 100dvh;
  }

  .sidebar {
    width: 380px;
    flex-shrink: 0;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
  }

  .brand {
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .brand-title { display: flex; align-items: center; gap: 10px; }
  .brand .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 0 15px var(--accent);
  }
  .brand h1 { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
  .brand h1 span {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; color: transparent;
  }

  .brand-actions {
    display: flex;
    gap: 6px;
  }

  .btn-add-channel {
    background: rgba(124,92,255,0.15);
    color: var(--accent);
    border: 1px solid rgba(124,92,255,0.3);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .btn-add-channel:hover {
    background: var(--accent);
    color: #fff;
    border-color: transparent;
  }

  .btn-sync {
    background: rgba(0,216,180,0.12);
    color: var(--accent2);
    border: 1px solid rgba(0,216,180,0.3);
    padding: 6px 9px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-sync:hover {
    background: var(--accent2);
    color: #000;
  }

  .search-box {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  .search-box input {
    width: 100%;
    padding: 8px 12px;
    border-radius: 8px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--line);
    color: #fff;
    font-size: 13px;
    outline: none;
  }
  .search-box input:focus {
    border-color: var(--accent);
  }

  .categories-section {
    flex: 0 0 auto;
    max-height: 36%;
    display: flex;
    flex-direction: column;
    border-bottom: 1px solid var(--line);
  }

  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    color: var(--muted);
    letter-spacing: 1px;
    padding: 10px 16px 4px;
    font-weight: 700;
  }

  .tabs {
    flex: 1;
    overflow-y: auto;
    padding: 0 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .tabs::-webkit-scrollbar { width: 4px; }
  .tabs::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .tab {
    padding: 9px 14px;
    border-radius: 8px;
    text-align: left;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    background: transparent;
    border: 1px solid transparent;
    transition: 0.2s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .tab:hover { background: rgba(255,255,255,0.03); color: #fff; }
  .tab.active {
    background: rgba(124,92,255,0.15);
    color: var(--accent);
    border-color: rgba(124,92,255,0.3);
  }
  .tab-count {
    font-size: 11px;
    opacity: 0.7;
    background: rgba(255,255,255,0.06);
    padding: 2px 6px;
    border-radius: 10px;
  }

  .channels-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .channels-container {
    flex: 1;
    overflow-y: auto;
    padding: 8px 12px 12px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 8px;
    align-content: start;
  }
  
  .channels-container::-webkit-scrollbar { width: 4px; }
  .channels-container::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .ch-card {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    padding: 10px 6px; border-radius: 10px; text-align: center;
    background: rgba(255,255,255,0.03); border: 1px solid var(--line);
    cursor: pointer; transition: 0.2s; position: relative;
  }
  .ch-card:hover {
    background: rgba(255,255,255,0.06); border-color: rgba(124,92,255,0.5); transform: translateY(-2px);
  }
  .ch-card.active {
    border-color: var(--accent2); background: rgba(0, 216, 180, 0.1);
  }

  .ch-card-actions {
    position: absolute; top: 4px; right: 4px;
    display: none; gap: 2px; z-index: 10;
  }
  .ch-card:hover .ch-card-actions { display: flex; }
  
  .btn-action {
    background: rgba(0,0,0,0.7); color: #fff;
    border: none; border-radius: 4px; padding: 3px 5px;
    font-size: 10px; cursor: pointer; transition: 0.2s;
  }
  .btn-action:hover { background: var(--accent); }
  .btn-action.delete:hover { background: var(--danger); }

  .ch-logo-wrapper {
    width: 44px; height: 44px;
    display: grid; place-items: center;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.9); 
    padding: 4px;
    overflow: hidden;
  }

  .ch-logo-img {
    width: 100%; height: 100%;
    object-fit: contain;
  }

  .ch-logo-fallback {
    width: 44px; height: 44px; border-radius: 8px;
    display: none; 
    place-items: center;
    font-size: 14px; font-weight: 900; color: #000;
    background: linear-gradient(140deg, hsl(var(--h) 82% 60%), hsl(calc(var(--h) + 45) 82% 48%));
  }

  .ch-name {
    font-size: 10px; font-weight: 600; color: #aeb8cf;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 24px;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #101424 0%, var(--bg) 100%);
  }

  .player-wrapper {
    width: 100%;
    max-width: 1100px;
    display: flex;
    flex-direction: column;
    transition: 0.3s;
    position: relative;
  }

  .player-frame {
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: 12px 12px 0 0;
    overflow: hidden;
    box-shadow: 0 15px 50px rgba(0,0,0,0.8);
    position: relative;
  }

  #playerIframe, #playerVideo {
    width: 100%; height: 100%; border: 0; display: block; position: absolute; top: 0; left: 0;
  }

  .edge-tap {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    height: 120px;
    width: 20px;
    z-index: 999;
    cursor: pointer;
    background: transparent;
    border-radius: 4px;
    touch-action: none;
  }
  .edge-tap.left { left: 0; }
  .edge-tap.right { right: 0; }
  .edge-tap:active { background: rgba(255, 255, 255, 0.3); }

  .player-wrapper:fullscreen {
    max-width: 100%;
    width: 100vw;
    height: 100vh;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .player-wrapper:fullscreen .player-frame {
    height: 100%;
    width: 100%;
    aspect-ratio: auto;
    border-radius: 0;
  }
  .player-wrapper:fullscreen .player-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(18, 23, 36, 0.85);
    backdrop-filter: blur(10px);
    border: none;
    border-radius: 0;
    z-index: 1000;
  }

  .player-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: #121724;
    border-radius: 0 0 12px 12px;
    border: 1px solid var(--line);
    border-top: none;
    transition: 0.3s;
    gap: 10px;
  }

  .nav-btn {
    width: 44px; height: 44px; border-radius: 12px;
    display: grid; place-items: center; flex-shrink: 0;
    font-size: 22px; font-weight: bold; color: #fff;
    cursor: pointer; background: rgba(255,255,255,0.05);
    border: 1px solid var(--line); transition: 0.2s;
  }
  .nav-btn:hover { background: var(--accent); border-color: transparent; }
  .nav-btn:active { transform: scale(0.95); }

  .now-playing {
    text-align: center; flex: 1; padding: 0 6px; min-width: 0;
  }
  .now-cat {
    font-size: 10px; color: var(--accent2); text-transform: uppercase; letter-spacing: 1px; font-weight: bold; margin-bottom: 2px; display: block;
  }
  .now-name {
    font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;
  }
  .now-epg {
    font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; margin-top: 2px;
  }

  .server-select {
    background: rgba(255,255,255,0.06);
    color: var(--txt);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 11px;
    font-weight: 600;
    outline: none;
    cursor: pointer;
    max-width: 145px;
  }
  .server-select option {
    background: #121724;
    color: #fff;
  }

  .counter {
    font-size: 12px; color: var(--muted); background: rgba(255,255,255,0.05);
    padding: 6px 12px; border-radius: 20px; border: 1px solid var(--line);
    white-space: nowrap;
  }

  /* MODAIS */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    backdrop-filter: blur(5px); z-index: 10000;
    display: none; justify-content: center; align-items: center;
  }
  .modal-overlay.show { display: flex; }
  
  .modal-box {
    background: #121724; border: 1px solid var(--line);
    border-radius: 12px; padding: 24px; width: 100%; max-width: 420px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .modal-box h2 { margin-bottom: 16px; font-size: 18px; color: var(--accent); }
  .modal-box label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; margin-top: 10px; }
  .modal-box input, .modal-box select {
    width: 100%; padding: 10px; border-radius: 8px;
    background: rgba(255,255,255,0.05); border: 1px solid var(--line);
    color: #fff; font-size: 14px; outline: none; margin-bottom: 10px;
  }
  .modal-box input:focus { border-color: var(--accent); }
  
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  .btn-modal { padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
  .btn-cancel { background: rgba(255,255,255,0.1); color: #fff; }
  .btn-cancel:hover { background: rgba(255,255,255,0.2); }
  .btn-confirm { background: var(--accent); color: #fff; }
  .btn-confirm:hover { background: #5b3cff; }

  .loading-msg {
    grid-column: 1 / -1;
    text-align: center;
    padding: 30px 10px;
    color: var(--muted);
    font-size: 13px;
  }

  @media (max-width: 850px) {
    .layout { flex-direction: column; }
    .main-content { order: 1; padding: 10px; flex: none; background: var(--bg); }
    .player-wrapper { max-width: 100%; }
    .player-bar { padding: 8px 10px; gap: 6px; }
    .nav-btn { width: 36px; height: 36px; font-size: 18px; }
    .now-playing .now-name { font-size: 14px; }
    .now-playing .now-cat { font-size: 9px; }
    .now-playing .now-epg { font-size: 10px; }
    .counter { display: none; }
    .server-select { max-width: 95px; font-size: 10px; padding: 4px; }

    .sidebar { order: 2; width: 100%; flex: 1; border-right: none; border-top: 1px solid var(--line); overflow: hidden; }
    .brand { display: none; }
    .categories-section { max-height: none; border-bottom: none; }
    .section-title { display: none; }

    .tabs { flex-direction: row; overflow-x: auto; overflow-y: hidden; padding: 8px 10px; gap: 8px; border-bottom: 1px solid var(--line); }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { white-space: nowrap; padding: 7px 14px; border-radius: 20px; font-size: 12px; gap: 6px; }

    .channels-section { flex: 1; overflow: hidden; }
    .channels-container { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); padding: 10px; gap: 8px; }
    .ch-logo-wrapper { width: 38px; height: 38px; padding: 3px; }
    .ch-logo-fallback { width: 38px; height: 38px; font-size: 12px; }
    .ch-name { font-size: 9px; }

    .edge-tap { width: 15px; }
    .ch-card-actions { display: flex; opacity: 0.7; }
  }
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-title">
        <div class="dot"></div>
        <h1><span>i9</span>tv</h1>
      </div>
      <div class="brand-actions">
        <button class="btn-sync" onclick="sincronizarAPI(true)" title="Atualizar lista da API">🔄</button>
        <button class="btn-add-channel" onclick="abrirSenha('add')">➕ Canal</button>
      </div>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="🔍 Buscar canal ou programação..." oninput="filtrarCanais(this.value)">
    </div>

    <div class="categories-section">
      <div class="section-title">Categorias</div>
      <div class="tabs" id="tabs"></div>
    </div>
    <div class="channels-section">
      <div class="section-title" id="channelSectionTitle">Canais</div>
      <div class="channels-container" id="channelsContainer">
        <div class="loading-msg">⏳ Carregando canais da API...</div>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <div class="player-wrapper" id="playerWrapper">
      <div class="player-frame">
        <iframe id="playerIframe" src="about:blank" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        <video id="playerVideo" controls autoplay playsinline style="display: none; background: #000; object-fit: contain;"></video>
        
        <div class="edge-tap left" id="tapPrev" title="Canal Anterior"></div>
        <div class="edge-tap right" id="tapNext" title="Próximo Canal"></div>
      </div>
      
      <div class="player-bar" id="playerBar">
        <button class="nav-btn" id="prevBtn" title="Canal Anterior">−</button>
        <div class="now-playing">
          <span class="now-cat" id="nowCat">CARREGANDO...</span>
          <span class="now-name" id="nowName">Aguarde a API...</span>
          <span class="now-epg" id="nowEpg"></span>
        </div>
        <select class="server-select" id="serverSelect" style="display: none;" onchange="trocarServidor(this.value)" title="Trocar Servidor"></select>
        <span class="counter" id="counter">0 / 0</span>
        <button class="nav-btn" id="fsBtn" title="Tela Cheia" style="font-size: 16px;">⛶</button>
        <button class="nav-btn" id="nextBtn" title="Próximo Canal">+</button>
      </div>
    </div>
  </main>
</div>

<!-- MODAL DE SENHA -->
<div class="modal-overlay" id="modalSenha">
  <div class="modal-box">
    <h2>🔒 Acesso Restrito</h2>
    <label>Digite a senha para continuar:</label>
    <input type="password" id="inputSenha" placeholder="Senha..." onkeypress="if(event.key==='Enter') verificarSenha()">
    <div class="modal-actions">
      <button class="btn-modal btn-cancel" onclick="fecharSenha()">Cancelar</button>
      <button class="btn-modal btn-confirm" onclick="verificarSenha()">Confirmar</button>
    </div>
  </div>
</div>

<!-- MODAL DE ADICIONAR / EDITAR CANAL -->
<div class="modal-overlay" id="modalCanal">
  <div class="modal-box">
    <h2 id="modalCanalTitle">📺 Adicionar Novo Canal</h2>
    
    <input type="hidden" id="editCatIdx" value="-1">
    <input type="hidden" id="editChanIdx" value="-1">

    <label>Nome do Canal</label>
    <input type="text" id="inputNome" placeholder="Ex: Meu Canal Favorito">
    
    <label>URL do Stream (.m3u8, .mp4 ou página/iframe)</label>
    <input type="text" id="inputUrl" placeholder="https://...">
    
    <label>Categoria</label>
    <input type="text" id="inputCategoria" list="listaCategorias" placeholder="Digite ou selecione...">
    <datalist id="listaCategorias"></datalist>
    
    <label>URL da Logo</label>
    <input type="text" id="inputLogo" placeholder="https://.../logo.png">
    
    <div class="modal-actions">
      <button class="btn-modal btn-cancel" onclick="fecharCanal()">Cancelar</button>
      <button class="btn-modal btn-confirm" onclick="salvarCanal()">Salvar Canal</button>
    </div>
  </div>
</div>

<script>

  ];

  try {
    var _safeWin = {
      focus: function(){}, blur: function(){}, close: function(){}, closed: false,
      document: { write: function(){}, location: {} }, location: { href: '' }
    };
    var _origOpen = window.open;
    window.open = function(url, target, features) {
      if (!url || url === 'about:blank') return _safeWin;
      var u = String(url).toLowerCase();
      for (var i = 0; i < adWords.length; i++) {
        if (u.indexOf(adWords[i]) !== -1) {
          return _safeWin;
        }
      }
      try { if (typeof _origOpen === 'function') return _origOpen.apply(window, arguments); } catch(e) {}
      return _safeWin;
    };
  } catch (e) {}

  window.addEventListener('beforeunload', function (e) {
    e.preventDefault();
    e.returnValue = 'Um anúncio tentou redirecionar você. Deseja sair?';
    return e.returnValue;
  });

  function removerOverlaysFantasmas() {
    try {
      var badElements = document.querySelectorAll('[data-rc-player-gesture], button[data-rc-player-gesture], [class*="rc-player-gesture"], .ad-overlay, [class*="floating-ad"], [class*="popunder"], [id*="popunder"], video[title="Advertisement"]');

<script>
// ==========================================
// CONFIGURAÇÃO DA API REI DOS CANAIS
// ==========================================
const API = 'https://api.reidoscanais.im';
const FALLBACK_PLAYER_BASE = 'https://rdcanais.org/';
const STORAGE_KEY = 'i9tv_api_reidoscanais_v4';

localStorage.removeItem('i9tv_canais_custom');

let CATEGORIES = [];
let ALL = [];
let currentCatIndex = 0;
let currentChanIndex = 0;
let hls = null;

const iframeEl = document.getElementById("playerIframe");
const videoEl = document.getElementById("playerVideo");
const nowName = document.getElementById("nowName");
const nowCat = document.getElementById("nowCat");
const nowEpg = document.getElementById("nowEpg");
const serverSelect = document.getElementById("serverSelect");
const counter = document.getElementById("counter");
const tabsEl = document.getElementById("tabs");
const channelsContainer = document.getElementById("channelsContainer");
const channelSectionTitle = document.getElementById("channelSectionTitle");
const playerWrapper = document.getElementById("playerWrapper");
const fsBtn = document.getElementById("fsBtn");

function normalizarLogo(logo) {
  if (!logo) return "";
  if (logo.startsWith("/")) return API + logo;
  return logo;
}

// Ajusta a Globo única da API para priorizar a Globo Sergipe
function configurarGloboSergipe(canalObj, baseEmbedExample) {
  const embedsAtualizados = [];

  // 1. Verifica se algum embed da própria API já é Sergipe
  const embedSergipeExistente = (canalObj.embeds || []).find(e =>
    `${e.provider} ${e.embed_url}`.toLowerCase().includes('sergipe') ||
    `${e.embed_url}`.toLowerCase().includes('globose')
  );

  if (embedSergipeExistente) {
    embedsAtualizados.push({
      provider: 'Globo Sergipe (FULL HD)',
      quality: embedSergipeExistente.quality || 'FULL HD',
      embed_url: embedSergipeExistente.embed_url
    });
  } else {
    // 2. Monta a URL da Globo Sergipe seguindo o padrão do player (ex: https://rdcanais.org/globose)
    let urlSergipe = `${FALLBACK_PLAYER_BASE}globose`;
    if (baseEmbedExample && baseEmbedExample.includes('/globo')) {
      urlSergipe = baseEmbedExample.replace(/\/globo[^/?#]*/i, '/globose');
    }
    embedsAtualizados.push({
      provider: 'Globo Sergipe (FULL HD)',
      quality: 'FULL HD',
      embed_url: urlSergipe
    });
  }

  // Mantém os demais embeds originais da API como servidores alternativos no seletor
  (canalObj.embeds || []).forEach(emb => {
    if (!embedsAtualizados.some(e => e.embed_url === emb.embed_url)) {
      embedsAtualizados.push(emb);
    }
  });

  return {
    ...canalObj,
    id: 'globose',
    name: 'Globo Sergipe',
    url: embedsAtualizados[0].embed_url,
    embeds: embedsAtualizados
  };
}

// ==========================================
// SINCRONIZAÇÃO COMPARTILHADA (TODOS DA FAMÍLIA)
// ==========================================
// Cole aqui o endereço do seu Firebase Realtime Database, ex:
// const FIREBASE_URL = 'https://i9tv-familia-default-rtdb.firebaseio.com';
const FIREBASE_URL = 'https://i9tv-familia-default-rtdb.firebaseio.com';

const SHARED_CACHE_KEY = STORAGE_KEY + '_shared_cache';
let SHARED = { extras: {}, removed: {}, overrides: {} };
let API_CANAIS = [];
let avisouSemNuvem = false;

function fbKey(id) { return String(id).replace(/[.$#\[\]\/]/g, '_'); }
function nuvemAtiva() { return !!FIREBASE_URL; }
function normalizarShared(d) {
  d = d || {};
  return { extras: d.extras || {}, removed: d.removed || {}, overrides: d.overrides || {} };
}
function lerCacheShared() {
  try {
    const c = localStorage.getItem(SHARED_CACHE_KEY);
    if (c) SHARED = normalizarShared(JSON.parse(c));
  } catch (e) {}
}
function gravarCacheShared() {
  try { localStorage.setItem(SHARED_CACHE_KEY, JSON.stringify(SHARED)); } catch (e) {}
}

async function carregarShared() {
  if (!nuvemAtiva()) { lerCacheShared(); return false; }
  try {
    const res = await fetch(`${FIREBASE_URL}/i9tv.json`, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    SHARED = normalizarShared(await res.json());
    gravarCacheShared();
    return true;
  } catch (e) {
    console.warn('Sem acesso à nuvem, usando cache local:', e);
    lerCacheShared();
    return false;
  }
}

// grupo/chave  (ex: "extras/custom_123"). valor null = apagar
async function escreverShared(caminho, valor) {
  const [grupo, chave] = caminho.split('/');
  if (valor === null) delete SHARED[grupo][chave];
  else SHARED[grupo][chave] = valor;
  gravarCacheShared();

  if (!nuvemAtiva()) {
    if (!avisouSemNuvem) {
      avisouSemNuvem = true;
      alert("⚠️ A sincronização na nuvem ainda não foi configurada (FIREBASE_URL vazio). A alteração ficou salva só neste aparelho.");
    }
    return false;
  }
  try {
    const res = await fetch(`${FIREBASE_URL}/i9tv/${caminho}.json`, {
      method: valor === null ? 'DELETE' : 'PUT',
      body: JSON.stringify(valor)
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return true;
  } catch (e) {
    console.error(e);
    alert("⚠️ Não consegui salvar na nuvem. Verifique a internet e as regras do Firebase. A alteração ficou só neste aparelho.");
    return false;
  }
}

// Envia para a nuvem os canais que você já criou antes neste aparelho
async function migrarExtrasAntigos() {
  const antigo = localStorage.getItem(STORAGE_KEY + '_extras');
  if (!antigo || !nuvemAtiva()) return;
  let tudoOk = true;
  try {
    const extras = JSON.parse(antigo);
    for (const ex of extras) {
      const k = fbKey(ex.channel.id);
      if (!SHARED.extras[k]) {
        const ok = await escreverShared('extras/' + k, { category: ex.category, channel: ex.channel });
        if (!ok) tudoOk = false;
      }
    }
  } catch (e) { tudoOk = false; }
  if (tudoOk) localStorage.removeItem(STORAGE_KEY + '_extras');
}

async function verificarAtualizacoes() {
  if (!nuvemAtiva() || API_CANAIS.length === 0) return;
  if (document.getElementById('modalCanal').classList.contains('show')) return;
  if (document.getElementById('modalSenha').classList.contains('show')) return;
  try {
    const res = await fetch(`${FIREBASE_URL}/i9tv.json`, { cache: 'no-store' });
    if (!res.ok) return;
    const novo = normalizarShared(await res.json());
    if (JSON.stringify(novo) !== JSON.stringify(SHARED)) {
      SHARED = novo;
      gravarCacheShared();
      reconstruir(true);
    }
  } catch (e) {}
}
setInterval(verificarAtualizacoes, 15000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) verificarAtualizacoes();
});

// ==========================================
// CARREGAMENTO DA API + MONTAGEM DAS CATEGORIAS
// ==========================================
async function sincronizarAPI(forcar = false) {
  channelsContainer.innerHTML = '<div class="loading-msg">⏳ Sincronizando canais...</div>';
  nowCat.textContent = "SINCRONIZANDO";
  nowName.textContent = "Buscando grade de canais...";
  nowEpg.textContent = "";

  try {
    await carregarShared();

    const res = await fetch(`${API}/channels`);
    if (!res.ok) throw new Error(`Erro HTTP: ${res.status}`);
    const json = await res.json();

    if (!json.success || !Array.isArray(json.data)) {
      throw new Error("Formato de resposta inesperado da API.");
    }

    API_CANAIS = [];

    json.data.forEach((item, idx) => {
      const catName = (item.category && String(item.category).trim()) ? String(item.category).trim() : "Geral";

      let embeds = [];
      if (Array.isArray(item.embeds)) {
        embeds = item.embeds.map((e, i) => ({
          provider: e.provider || `Servidor ${i + 1}`,
          quality: e.quality || 'HD',
          embed_url: e.embed_url || ''
        })).filter(e => e.embed_url);
      }

      if (embeds.length === 0 && item.id) {
        embeds.push({
          provider: 'Principal',
          quality: 'HD',
          embed_url: `${FALLBACK_PLAYER_BASE}${item.id}`
        });
      }

      let canalObj = {
        id: item.id || `ch_${idx}`,
        url: embeds.length > 0 ? embeds[0].embed_url : `${FALLBACK_PLAYER_BASE}${item.id}`,
        name: item.name || `Canal ${idx + 1}`,
        logo: normalizarLogo(item.logo_url || ""),
        embeds: embeds,
        epg: item.epg || null
      };

      const ehGlobo = `${canalObj.id} ${canalObj.name}`.toLowerCase().includes('globo');
      if (ehGlobo) {
        canalObj = configurarGloboSergipe(canalObj, embeds[0]?.embed_url || '');
      }

      API_CANAIS.push({ category: catName, channel: canalObj });
    });

    await migrarExtrasAntigos();

    reconstruir(false);

    if (CATEGORIES.length > 0 && CATEGORIES[0].channels.length > 0) {
      playChannel(0, 0);
    } else {
      channelsContainer.innerHTML = '<div class="loading-msg">Nenhum canal disponível no momento.</div>';
    }

  } catch (err) {
    console.error("Falha ao carregar API:", err);
    nowCat.textContent = "ERRO DE CONEXÃO";
    nowName.textContent = "Não foi possível carregar a API";
    nowEpg.textContent = err.message;
    channelsContainer.innerHTML = `
      <div class="loading-msg">
        ❌ Falha ao conectar em <b>${API}/channels</b>.<br><br>
        <button class="btn-add-channel" style="margin: 0 auto;" onclick="sincronizarAPI(true)">Tentar Novamente</button>
      </div>
    `;
  }
}

// Junta: canais da API + canais extras da família - removidos + edições
function reconstruir(preservar) {
  let idAtual = null, catAtual = null;
  if (preservar && CATEGORIES[currentCatIndex]) {
    catAtual = CATEGORIES[currentCatIndex].name;
    idAtual = CATEGORIES[currentCatIndex].channels[currentChanIndex]?.id;
  }

  let lista = API_CANAIS.map(x => ({ category: x.category, channel: x.channel }));
  Object.values(SHARED.extras).forEach(ex => {
    if (ex && ex.channel && ex.category) lista.push({ category: ex.category, channel: ex.channel });
  });

  lista = lista.filter(x => !SHARED.removed[fbKey(x.channel.id)]);

  lista = lista.map(x => {
    const ov = SHARED.overrides[fbKey(x.channel.id)];
    if (!ov) return x;
    return {
      category: ov.category || x.category,
      channel: {
        ...x.channel,
        name: ov.name,
        url: ov.url,
        logo: ov.logo || '',
        embeds: [{ provider: "Personalizado", quality: "HD", embed_url: ov.url }]
      }
    };
  });

  const nomes = new Map();
  const mapa = {};
  const todos = [];
  lista.forEach(({ category, channel }) => {
    const low = category.toLowerCase();
    if (!nomes.has(low)) { nomes.set(low, category); mapa[category] = []; }
    mapa[nomes.get(low)].push(channel);
    todos.push(channel);
  });

  CATEGORIES = [];
  if (todos.length > 0) CATEGORIES.push({ name: "Todos os Canais", channels: todos });
  const globo = todos.find(c => c.id === 'globose');
  if (globo) CATEGORIES.push({ name: "Globo", channels: [globo] });
  Object.keys(mapa).forEach(n => CATEGORIES.push({ name: n, channels: mapa[n] }));

  rebuildALL();
  renderTabs();

  if (!preservar) return;

  // Mantém o canal que está tocando, sem reiniciar o vídeo
  const ci = CATEGORIES.findIndex(c => c.name === catAtual);
  const chi = ci >= 0 ? CATEGORIES[ci].channels.findIndex(c => c.id === idAtual) : -1;
  if (ci >= 0 && chi >= 0) {
    currentCatIndex = ci;
    currentChanIndex = chi;
    document.querySelectorAll(".tab").forEach((btn, idx) => btn.classList.toggle("active", idx === ci));
    const termo = document.getElementById("searchInput").value;
    if (termo.trim()) {
      filtrarCanais(termo);
    } else {
      channelSectionTitle.textContent = `Canais: ${CATEGORIES[ci].name} (${CATEGORIES[ci].channels.length})`;
      renderChannels(ci, idAtual);
    }
  } else if (CATEGORIES.length > 0) {
    const alvo = ci >= 0 ? ci : 0;
    playChannel(alvo, 0);
  }
}

function tocarPorId(id, catNome) {
  let ci = CATEGORIES.findIndex(c => c.name.toLowerCase() === String(catNome).toLowerCase());
  if (ci < 0) ci = 0;
  let chi = CATEGORIES[ci].channels.findIndex(c => c.id === id);
  if (chi < 0) chi = 0;
  playChannel(ci, chi);
}

function rebuildALL() {
  ALL = [];
  const categoriasVirtuais = ["Todos os Canais", "Globo"];
  CATEGORIES.forEach((cat, catIdx) => {
    if (categoriasVirtuais.includes(cat.name)) return;
    cat.channels.forEach((ch, chanIdx) => {
      ALL.push({ ...ch, category: cat.name, catIdx, chanIdx });
    });
  });
}

function renderTabs() {
  tabsEl.innerHTML = "";
  CATEGORIES.forEach((cat, idx) => {
    const btn = document.createElement("button");
    btn.className = "tab";
    btn.innerHTML = `<span>${cat.name}</span><span class="tab-count">${cat.channels.length}</span>`;
    btn.onclick = () => {
      document.getElementById("searchInput").value = "";
      playChannel(idx, 0);
    };
    tabsEl.appendChild(btn);
  });
}

// ==========================================
// REPRODUÇÃO DE STREAM & TROCA DE SERVIDORES
// ==========================================
function carregarStreamUrl(streamUrl) {
  if (!streamUrl) return;
  if (hls) {
    hls.destroy();
    hls = null;
  }

  const ehVideoDireto = /\.(mp4|webm|ogg)([?#]|$)/i.test(streamUrl);

  if (ehVideoDireto) {
    iframeEl.style.display = 'none';
    iframeEl.src = 'about:blank';
    videoEl.style.display = 'block';
    videoEl.pause();
    videoEl.referrerPolicy = 'no-referrer';
    videoEl.src = streamUrl;
    videoEl.load();
    videoEl.play().catch(e => console.log("Erro ao dar play:", e));
  } else if (streamUrl.includes('.m3u8')) {
    iframeEl.style.display = 'none';
    iframeEl.src = 'about:blank';
    videoEl.style.display = 'block';
    videoEl.src = '';
    
    if (Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(streamUrl);
      hls.attachMedia(videoEl);
      hls.on(Hls.Events.MANIFEST_PARSED, function() {
        videoEl.play().catch(e => console.log("Erro ao dar play:", e));
      });
    } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
      videoEl.src = streamUrl;
      videoEl.addEventListener('loadedmetadata', function() {
        videoEl.play().catch(e => console.log("Erro ao dar play:", e));
      }, { once: true });
    }
  } else {
    videoEl.style.display = 'none';
    videoEl.pause();
    videoEl.src = '';
    iframeEl.style.display = 'block';
    iframeEl.src = streamUrl;
  }
}

function trocarServidor(novaUrl) {
  if (!novaUrl) return;
  carregarStreamUrl(novaUrl);
}

function playChannel(catIdx, chanIdx) {
  if (catIdx < 0 || catIdx >= CATEGORIES.length) return;
  if (chanIdx < 0 || chanIdx >= CATEGORIES[catIdx].channels.length) return;

  currentCatIndex = catIdx;
  currentChanIndex = chanIdx;
  
  const cat = CATEGORIES[catIdx];
  const ch = cat.channels[chanIdx];
  
  nowCat.textContent = cat.name;
  nowName.textContent = ch.name;

  if (ch.epg && ch.epg.current && ch.epg.current.title) {
    let textoEpg = `🔴 Agora: ${ch.epg.current.title}`;
    if (ch.epg.next && ch.epg.next.title) {
      textoEpg += `  •  ⏭️ A seguir: ${ch.epg.next.title}`;
    }
    nowEpg.textContent = textoEpg;
  } else {
    nowEpg.textContent = "Transmissão Ao Vivo";
  }

  if (Array.isArray(ch.embeds) && ch.embeds.length > 1) {
    serverSelect.style.display = 'block';
    serverSelect.innerHTML = '';
    ch.embeds.forEach((emb, i) => {
      const opt = document.createElement('option');
      opt.value = emb.embed_url;
      const label = emb.provider || `Servidor ${i + 1}`;
      const qual = emb.quality && !label.includes(emb.quality) ? ` (${emb.quality})` : '';
      opt.textContent = label + qual;
      serverSelect.appendChild(opt);
    });
  } else {
    serverSelect.style.display = 'none';
    serverSelect.innerHTML = '';
  }
  
  const globalIndex = ALL.findIndex(c => c.id === ch.id && c.name === ch.name);
  counter.textContent = (globalIndex >= 0 ? globalIndex + 1 : chanIdx + 1) + " / " + ALL.length;

  document.querySelectorAll(".tab").forEach((btn, idx) => {
    btn.classList.toggle("active", idx === catIdx);
  });

  channelSectionTitle.textContent = `Canais: ${cat.name} (${cat.channels.length})`;

  carregarStreamUrl(ch.url);
  renderChannels(catIdx, ch.id);
}

function renderChannels(catIdx, activeId) {
  channelsContainer.innerHTML = "";
  const cat = CATEGORIES[catIdx];

  cat.channels.forEach((ch, chanIdx) => {
    const card = criarCardCanal(ch, catIdx, chanIdx, ch.id === activeId);
    channelsContainer.appendChild(card);
  });
}

function criarCardCanal(ch, catIdx, chanIdx, isActive) {
  const card = document.createElement("div");
  card.className = "ch-card" + (isActive ? " active" : "");
  
  let h = 0;
  for (let i = 0; i < ch.name.length; i++) h = (h * 31 + ch.name.charCodeAt(i)) % 360;
  const initials = ch.name.substring(0, 2).toUpperCase();
  const logoUrl = ch.logo || "";

  card.innerHTML = `
    <div class="ch-card-actions">
      <button class="btn-action" onclick="abrirSenhaEdicao(${catIdx}, ${chanIdx})" title="Editar Canal">✏️</button>
      <button class="btn-action delete" onclick="removerCanal(event, ${catIdx}, ${chanIdx})" title="Apagar Canal">🗑️</button>
    </div>
    <div class="ch-logo-wrapper" style="${!logoUrl ? 'background:transparent;padding:0;' : ''}">
      ${logoUrl ? `<img src="${logoUrl}" class="ch-logo-img" alt="${ch.name}" onerror="this.style.display='none'; this.parentElement.style.background='transparent'; this.parentElement.style.padding='0'; this.nextElementSibling.style.display='grid';">` : ''}
      <div class="ch-logo-fallback" style="--h:${h}; ${!logoUrl ? 'display:grid;' : ''}">${initials}</div>
    </div>
    <div class="ch-name">${ch.name}</div>
  `;
  
  card.onclick = (e) => {
    if (e.target.tagName !== 'BUTTON') {
      playChannel(catIdx, chanIdx);
    }
  };
  return card;
}

// ==========================================
// BUSCA LOCAL INSTANTÂNEA
// ==========================================
function filtrarCanais(termo) {
  const q = termo.trim().toLowerCase();
  if (!q) {
    renderChannels(currentCatIndex, CATEGORIES[currentCatIndex]?.channels[currentChanIndex]?.id);
    channelSectionTitle.textContent = `Canais: ${CATEGORIES[currentCatIndex]?.name || ''} (${CATEGORIES[currentCatIndex]?.channels.length || 0})`;
    return;
  }

  channelsContainer.innerHTML = "";
  const filtrados = ALL.filter(item => {
    const matchNome = item.name.toLowerCase().includes(q);
    const matchCat = item.category.toLowerCase().includes(q);
    const matchEpg = item.epg?.current?.title?.toLowerCase().includes(q);
    return matchNome || matchCat || matchEpg;
  });

  channelSectionTitle.textContent = `Busca: "${termo}" (${filtrados.length})`;

  if (filtrados.length === 0) {
    channelsContainer.innerHTML = '<div class="loading-msg">Nenhum canal encontrado.</div>';
    return;
  }

  filtrados.forEach(item => {
    const isActive = (item.catIdx === currentCatIndex && item.chanIdx === currentChanIndex);
    const card = criarCardCanal(item, item.catIdx, item.chanIdx, isActive);
    channelsContainer.appendChild(card);
  });
}

async function salvarCanal() {
  const nome = document.getElementById('inputNome').value.trim();
  const url = document.getElementById('inputUrl').value.trim();
  const categoria = document.getElementById('inputCategoria').value.trim();
  const logo = document.getElementById('inputLogo').value.trim();
  const editCatIdx = parseInt(document.getElementById('editCatIdx').value);
  const editChanIdx = parseInt(document.getElementById('editChanIdx').value);

  if (!nome || !url || !categoria) {
    alert("Por favor, preencha o Nome, a URL e a Categoria.");
    return;
  }

  const embeds = [{ provider: "Personalizado", quality: "HD", embed_url: url }];
  let idFinal;

  if (editCatIdx !== -1 && editChanIdx !== -1) {
    const ch = CATEGORIES[editCatIdx]?.channels[editChanIdx];
    if (!ch) { fecharCanal(); return; }
    idFinal = ch.id;
    const k = fbKey(ch.id);
    if (ch.isCustom) {
      await escreverShared('extras/' + k, {
        category: categoria,
        channel: { ...ch, name: nome, url: url, logo: logo, embeds: embeds, isCustom: true }
      });
    } else {
      await escreverShared('overrides/' + k, { name: nome, url: url, logo: logo, category: categoria });
    }
  } else {
    idFinal = "custom_" + Date.now();
    await escreverShared('extras/' + fbKey(idFinal), {
      category: categoria,
      channel: { id: idFinal, url: url, name: nome, logo: logo, isCustom: true, embeds: embeds, epg: null }
    });
  }

  fecharCanal();
  reconstruir(false);
  tocarPorId(idFinal, categoria);
}

async function removerCanal(event, catIdx, chanIdx) {
  event.stopPropagation();
  const ch = CATEGORIES[catIdx]?.channels[chanIdx];
  if (!ch) return;
  if (!confirm("Tem certeza que deseja remover este canal para TODOS?")) return;

  const k = fbKey(ch.id);
  if (ch.isCustom) await escreverShared('extras/' + k, null);
  else await escreverShared('removed/' + k, true);

  // se o canal removido estava tocando, reconstruir(true) troca para outro
  reconstruir(true);
}

// ==========================================
// NAVEGAÇÃO, TECLADO, TELA CHEIA E SWIPE
// ==========================================
function nextChannel() {
  if (CATEGORIES.length === 0) return;
  const cat = CATEGORIES[currentCatIndex];
  if (currentChanIndex < cat.channels.length - 1) {
    playChannel(currentCatIndex, currentChanIndex + 1);
  } else {
    playChannel((currentCatIndex + 1) % CATEGORIES.length, 0);
  }
}

function prevChannel() {
  if (CATEGORIES.length === 0) return;
  if (currentChanIndex > 0) {
    playChannel(currentCatIndex, currentChanIndex - 1);
  } else {
    const prevCat = (currentCatIndex - 1 + CATEGORIES.length) % CATEGORIES.length;
    playChannel(prevCat, CATEGORIES[prevCat].channels.length - 1);
  }
}

document.getElementById("nextBtn").onclick = nextChannel;
document.getElementById("prevBtn").onclick = prevChannel;
document.getElementById("tapNext").onclick = nextChannel;
document.getElementById("tapPrev").onclick = prevChannel;

document.addEventListener("keydown", (e) => {
  if (document.activeElement.tagName === "INPUT") return;
  if (e.key === "ArrowRight") nextChannel();
  if (e.key === "ArrowLeft") prevChannel();
});

fsBtn.onclick = () => {
  if (!document.fullscreenElement) {
    if (playerWrapper.requestFullscreen) playerWrapper.requestFullscreen();
    else if (playerWrapper.webkitRequestFullscreen) playerWrapper.webkitRequestFullscreen();
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
};

document.addEventListener('fullscreenchange', () => {
  if (document.fullscreenElement) {
    fsBtn.innerHTML = '✖';
    fsBtn.title = "Sair da Tela Cheia";
  } else {
    fsBtn.innerHTML = '⛶';
    fsBtn.title = "Tela Cheia";
  }
});

let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;

document.addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
  touchStartY = e.changedTouches[0].screenY;
  touchStartTime = Date.now();
}, { passive: true });

document.addEventListener('touchend', (e) => {
  const touchEndX = e.changedTouches[0].screenX;
  const touchEndY = e.changedTouches[0].screenY;
  const dx = touchEndX - touchStartX;
  const dy = touchEndY - touchStartY;
  const dt = Date.now() - touchStartTime;

  if (dt < 500 && Math.abs(dx) > 60 && Math.abs(dy) < 80) {
    if (dx < 0) nextChannel();
    else prevChannel();
  }
}, { passive: true });

// Inicialização automática via API
sincronizarAPI(false);
</script>
