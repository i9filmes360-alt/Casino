<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rei dos Canais - Streaming & EPG</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
              dark: '#0f172a',
              card: '#1e293b'
            }
          }
        }
      }
    }
  </script>
  
  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
    
    .aspect-video-container {
      position: relative;
      padding-bottom: 56.25%; /* Ratio 16:9 */
      height: 0;
      overflow: hidden;
      background-color: #000;
      isolation: isolate;
      contain: strict;
      transform: translate3d(0, 0, 0);
      -webkit-transform: translate3d(0, 0, 0);
      will-change: transform;
    }
    
    .aspect-video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Header / Navbar -->
  <header class="sticky top-0 z-40 bg-slate-900 border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 gap-4">
        
        <!-- Logo -->
        <div class="flex items-center gap-3 cursor-pointer group" onclick="goHome()">
          <div class="bg-indigo-600 p-2.5 rounded-xl shadow-lg shadow-indigo-500/20 group-hover:scale-105 transition-transform">
            <i data-lucide="tv" class="w-6 h-6 text-white"></i>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <span class="font-bold text-xl tracking-tight text-white">Rei dos Canais</span>
              <span class="text-[10px] uppercase tracking-wider px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 font-semibold">Web</span>
            </div>
            <p class="text-xs text-slate-400 flex items-center gap-1">
              <i data-lucide="home" class="w-3 h-3"></i> Voltar ao início
            </p>
          </div>
        </div>

        <!-- Global Search Bar -->
        <div class="flex-1 max-w-xl hidden md:block">
          <div class="relative">
            <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input 
              type="text" 
              id="searchInput" 
              placeholder="Buscar canais, jogos, futebol, programas..." 
              class="w-full bg-slate-950 border border-slate-800 rounded-full pl-10 pr-10 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-all"
              oninput="handleSearch(this.value)"
            />
            <button id="clearSearchBtn" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white" onclick="clearSearch()">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Mode Toggle & Status Indicator -->
        <div class="flex items-center gap-3">
          <button 
            id="dataSourceToggleBtn"
            onclick="syncWithRemoteApi(true)"
            class="px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-800 text-xs font-medium text-slate-300 flex items-center gap-2 transition"
          >
            <i data-lucide="server" class="w-3.5 h-3.5 text-indigo-400"></i>
            <span id="dataSourceLabel">Status API</span>
          </button>

          <!-- Health Status Badge -->
          <div id="healthBadge" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-800 border border-slate-700 text-xs font-medium text-slate-400">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" id="healthDot"></span>
            <span id="healthStatusText">Conectando...</span>
          </div>
        </div>

      </div>

      <!-- Mobile Search Bar -->
      <div class="pb-3 md:hidden">
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input 
            type="text" 
            placeholder="Buscar canais, esportes..." 
            class="w-full bg-slate-950 border border-slate-800 rounded-full pl-10 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500"
            oninput="handleSearch(this.value)"
          />
        </div>
      </div>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <div class="bg-slate-900 border-b border-slate-800 sticky top-16 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between overflow-x-auto py-2.5 no-scrollbar gap-2">
        <div class="flex items-center space-x-2">
          <button 
            id="tabAllChannels" 
            onclick="switchTab('channels')" 
            class="px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2 bg-indigo-600 text-white shadow-lg"
          >
            <i data-lucide="layout-grid" class="w-4 h-4"></i> Início / Canais
          </button>
          <button 
            id="tabSports" 
            onclick="switchTab('sports')" 
            class="px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition flex items-center gap-2"
          >
            <i data-lucide="trophy" class="w-4 h-4 text-amber-400"></i> Esportes Ao Vivo
          </button>
          <button 
            id="tabCategories" 
            onclick="switchTab('categories')" 
            class="px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition flex items-center gap-2"
          >
            <i data-lucide="layers" class="w-4 h-4 text-indigo-400"></i> Categorias
          </button>
          <button 
            id="tabFavorites" 
            onclick="switchTab('favorites')" 
            class="px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition flex items-center gap-2"
          >
            <i data-lucide="heart" class="w-4 h-4 text-rose-500"></i> Favoritos
            <span id="favCountBadge" class="bg-slate-800 text-slate-300 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
          </button>
        </div>

        <button 
          onclick="syncWithRemoteApi(true)" 
          class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition flex items-center gap-1.5 text-xs"
        >
          <i data-lucide="refresh-cw" class="w-3.5 h-3.5" id="refreshIcon"></i>
          <span class="hidden sm:inline">Sincronizar API</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Connection Status Banner -->
  <div id="connectionBanner" class="hidden bg-amber-500/10 border-b border-amber-500/20 px-4 py-2 text-xs text-amber-300">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <i data-lucide="alert-triangle" class="w-4 h-4 text-amber-400"></i>
        <span id="bannerText">Tentando restabelecer conexão automática com a API...</span>
      </div>
      <button onclick="syncWithRemoteApi(true)" class="underline font-semibold hover:text-white">Forçar Agora</button>
    </div>
  </div>

  <!-- Main Content Area -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

    <!-- Categories Filter Bar -->
    <div id="categoryFilterContainer" class="mb-6 flex items-center gap-2 overflow-x-auto pb-2 no-scrollbar"></div>

    <!-- Live Search Results Section -->
    <div id="searchResultsSection" class="hidden mb-10">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xl font-bold flex items-center gap-2 text-indigo-400">
          <i data-lucide="search" class="w-5 h-5"></i> Resultados para "<span id="searchQueryTerm"></span>"
        </h2>
        <span id="searchResultCount" class="text-xs text-slate-400"></span>
      </div>
      <div id="searchResultsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
    </div>

    <!-- Main Views Container -->
    <div id="mainContainer"></div>

  </main>

  <!-- Player Modal -->
  <div id="playerModal" class="fixed inset-0 z-50 hidden bg-black/95 flex items-center justify-center p-2 sm:p-4" onclick="handleModalBgClick(event)">
    <div class="bg-slate-900 border border-slate-800 rounded-xl w-full max-w-4xl overflow-hidden shadow-2xl flex flex-col max-h-[98vh]" onclick="event.stopPropagation()">
      
      <!-- Player Header -->
      <div class="p-3 sm:p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900">
        <div class="flex items-center gap-3">
          <button onclick="closeModal()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold shadow transition">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Voltar aos Canais
          </button>
          <div class="h-4 w-px bg-slate-700 hidden sm:block"></div>
          <div class="flex items-center gap-2 sm:gap-3">
            <img id="modalLogo" src="" alt="Logo" class="w-7 h-7 sm:w-8 sm:h-8 rounded object-cover bg-slate-950 border border-slate-800">
            <div>
              <h3 id="modalTitle" class="font-bold text-white text-sm sm:text-base leading-tight">--</h3>
              <p id="modalCategory" class="text-[10px] sm:text-xs text-indigo-400 font-medium">--</p>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <button id="modalFavBtn" onclick="toggleCurrentModalFavorite()" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-rose-500 transition">
            <i data-lucide="heart" class="w-5 h-5"></i>
          </button>
          <button onclick="closeModal()" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white transition">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <!-- Player Frame -->
      <div class="bg-black aspect-video-container relative">
        <iframe 
          id="videoIframe" 
          src="" 
          frameborder="0" 
          allowfullscreen 
          allow="autoplay; encrypted-media; picture-in-picture; accelerometer; gyroscope"
          scrolling="no"
          class="w-full h-full"
        ></iframe>
      </div>

      <!-- Controls -->
      <div class="p-3 sm:p-4 bg-slate-900 border-t border-slate-800 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
        <div class="flex items-center gap-2 flex-wrap" id="serverContainer">
          <span class="text-xs font-medium text-slate-400 flex items-center gap-1">
            <i data-lucide="server" class="w-3.5 h-3.5"></i> Servidor:
          </span>
        </div>

        <button 
          onclick="copyEmbedCode()" 
          class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-medium text-slate-300 flex items-center gap-2 transition ml-auto sm:ml-0"
        >
          <i data-lucide="code" class="w-3.5 h-3.5 text-indigo-400"></i>
          <span id="copyEmbedText">Copiar Embed</span>
        </button>
      </div>

      <!-- EPG / Details -->
      <div class="p-3 sm:p-4 bg-slate-950/80 overflow-y-auto max-h-36 border-t border-slate-800">
        <div id="modalEpgDetails"></div>
      </div>

    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-slate-900 border-t border-slate-800 py-6 mt-12 text-slate-400 text-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-2">
        <div class="bg-indigo-600/20 p-1.5 rounded text-indigo-400">
          <i data-lucide="tv" class="w-4 h-4"></i>
        </div>
        <p>© 2026 Rei dos Canais Web Client.</p>
      </div>
      <div class="flex items-center gap-4 text-slate-500">
        <a href="https://api.reidoscanais.my" target="_blank" class="hover:text-slate-300 flex items-center gap-1">
          <i data-lucide="external-link" class="w-3 h-3"></i> Documentação API
        </a>
      </div>
    </div>
  </footer>

  <!-- Application Logic -->
  <script>
    const API_BASE = 'https://api.reidoscanais.my';

    const INITIAL_CATALOG = {
      channels: [
        {
          id: "globo",
          name: "Globo SP",
          description: "Sinal aberto HD de São Paulo",
          logo_url: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/Rede_Globo_logo.svg/300px-Rede_Globo_logo.svg.png",
          category: "Entretenimento",
          embeds: [
            { provider: "Servidor 1", quality: "HD", embed_url: "https://www.youtube.com/embed/live_stream" }
          ],
          epg: {
            current: {
              title: "Jornal Nacional",
              description: "Notícias do Brasil e do Mundo.",
              formatted_time: "20:30 - 21:30"
            }
          }
        },
        {
          id: "sportv",
          name: "SporTV HD",
          description: "O canal campeão",
          logo_url: "https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/SporTV_logo.svg/320px-SporTV_logo.svg.png",
          category: "Esportes",
          embeds: [{ provider: "Servidor 1", quality: "FHD", embed_url: "https://www.youtube.com/embed/live_stream" }]
        },
        {
          id: "espn",
          name: "ESPN Brasil",
          description: "Líder em esportes",
          logo_url: "https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/ESPN_wordmark.svg/320px-ESPN_wordmark.svg.png",
          category: "Esportes",
          embeds: [{ provider: "Servidor 1", quality: "HD", embed_url: "https://www.youtube.com/embed/live_stream" }]
        },
        {
          id: "globonews",
          name: "GloboNews",
          description: "Jornalismo 24h",
          logo_url: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/GloboNews_2010.svg/320px-GloboNews_2010.svg.png",
          category: "Notícias",
          embeds: [{ provider: "Servidor 1", quality: "HD", embed_url: "https://www.youtube.com/embed/live_stream" }]
        },
        {
          id: "megapix",
          name: "Megapix",
          description: "Grandes sucessos do cinema",
          logo_url: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Megapix_logo.svg/320px-Megapix_logo.svg.png",
          category: "Filmes e Séries",
          embeds: [{ provider: "Servidor 1", quality: "HD", embed_url: "https://www.youtube.com/embed/live_stream" }]
        },
        {
          id: "cartoon",
          name: "Cartoon Network",
          description: "Animação 24h",
          logo_url: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/80/Cartoon_Network_2010_logo.svg/320px-Cartoon_Network_2010_logo.svg.png",
          category: "Infantil",
          embeds: [{ provider: "Servidor 1", quality: "HD", embed_url: "https://www.youtube.com/embed/live_stream" }]
        }
      ],
      sports: [
        {
          id: "fla-x-pal-2026",
          title: "Flamengo x Palmeiras",
          description: "Campeonato Brasileiro 2026",
          category: "Futebol",
          competition: "Brasileirão Série A",
          teams: {
            home: { name: "Flamengo", logo: "https://upload.wikimedia.org/wikipedia/commons/2/2e/Flamengo_braz_logo.svg" },
            away: { name: "Palmeiras", logo: "https://upload.wikimedia.org/wikipedia/commons/1/10/Palmeiras_logo.svg" }
          },
          start_time: "Ao Vivo",
          status: "live",
          embeds: [{ provider: "Premiere HD", quality: "1080p", embed_url: "https://www.youtube.com/embed/live_stream" }]
        }
      ]
    };

    let state = {
      activeTab: 'channels',
      channels: [...INITIAL_CATALOG.channels],
      sports: [...INITIAL_CATALOG.sports],
      categories: [],
      favorites: JSON.parse(localStorage.getItem('rdc_favorites') || '[]'),
      selectedCategory: 'all',
      activeEmbedUrl: '',
      currentPlayingItem: null,
      searchQuery: '',
      retryCount: 0,
      isApiConnected: false
    };

    document.addEventListener('DOMContentLoaded', () => {
      extractCategories();
      renderView();
      lucide.createIcons();

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
      });

      // Inicia a sincronização automática em background imediatamente
      syncWithRemoteApi(false);

      // Loop de reconexão automática caso perca conexão (tenta a cada 15 segundos se estiver offline)
      setInterval(() => {
        if (!state.isApiConnected) {
          syncWithRemoteApi(false);
        }
      }, 15000);
    });

    function goHome() {
      clearSearch();
      state.selectedCategory = 'all';
      switchTab('channels');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function syncWithRemoteApi(isManual = false) {
      const icon = document.getElementById('refreshIcon');
      if (icon) icon.classList.add('animate-spin');

      if (isManual) {
        document.getElementById('healthStatusText').innerText = "Reconectando...";
      }

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 3500);

      try {
        const [channelsRes, sportsRes] = await Promise.all([
          fetch(`${API_BASE}/channels`, { signal: controller.signal }),
          fetch(`${API_BASE}/sports`, { signal: controller.signal })
        ]);
        
        clearTimeout(timeoutId);
        
        if (channelsRes.ok) {
          const channelsJson = await channelsRes.json();
          if (channelsJson.data && channelsJson.data.length > 0) {
            state.channels = channelsJson.data;
          }
        }

        if (sportsRes.ok) {
          const sportsJson = await sportsRes.json();
          if (sportsJson.data && sportsJson.data.length > 0) {
            state.sports = sportsJson.data;
          }
        }

        state.isApiConnected = true;
        state.retryCount = 0;
        extractCategories();
        renderView();
        
        document.getElementById('healthStatusText').innerText = "API Online";
        document.getElementById('healthDot').className = "w-2 h-2 rounded-full bg-emerald-500 animate-pulse";
        document.getElementById('connectionBanner').classList.add('hidden');

      } catch (e) {
        state.isApiConnected = false;
        state.retryCount++;
        
        document.getElementById('healthStatusText').innerText = "Modo Local (Reconectando...)";
        document.getElementById('healthDot').className = "w-2 h-2 rounded-full bg-amber-500 animate-pulse";
        document.getElementById('connectionBanner').classList.remove('hidden');
        document.getElementById('bannerText').innerText = `API instável. Tentativa automática nº ${state.retryCount} em segundo plano...`;
      } finally {
        if (icon) icon.classList.remove('animate-spin');
      }
    }

    function extractCategories() {
      const cats = new Set();
      state.channels.forEach(c => { if(c.category) cats.add(c.category); });
      state.sports.forEach(s => { if(s.category) cats.add(s.category); });
      state.categories = Array.from(cats);
      renderCategoryPills();
    }

    function renderCategoryPills() {
      const container = document.getElementById('categoryFilterContainer');
      if (state.activeTab === 'sports') {
        container.innerHTML = '';
        return;
      }

      let html = `
        <button 
          onclick="filterCategory('all')" 
          class="px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition ${state.selectedCategory === 'all' ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-900 border border-slate-800 text-slate-400 hover:text-white'}"
        >
          Todas as Categorias
        </button>
      `;

      state.categories.forEach(cat => {
        const isActive = state.selectedCategory === cat;
        html += `
          <button 
            onclick="filterCategory('${cat}')" 
            class="px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition ${isActive ? 'bg-indigo-600 text-white shadow-md' : 'bg-slate-900 border border-slate-800 text-slate-400 hover:text-white'}"
          >
            ${getCategoryIcon(cat)} ${cat}
          </button>
        `;
      });

      container.innerHTML = html;
      lucide.createIcons();
    }

    function filterCategory(cat) {
      state.selectedCategory = cat;
      renderCategoryPills();
      renderView();
    }

    function switchTab(tab) {
      state.activeTab = tab;
      const tabs = ['channels', 'sports', 'categories', 'favorites'];
      tabs.forEach(t => {
        const btn = document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}`);
        if (!btn) return;
        if (t === tab) {
          btn.className = "px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2 bg-indigo-600 text-white shadow-lg";
        } else {
          btn.className = "px-4 py-2 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition flex items-center gap-2";
        }
      });
      renderCategoryPills();
      renderView();
    }

    function getCategoryIcon(cat) {
      const c = cat.toLowerCase();
      if (c.includes('esporte') || c.includes('futebol')) return '⚽';
      if (c.includes('notícia') || c.includes('jornal')) return '📰';
      if (c.includes('filme') || c.includes('série')) return '🎬';
      if (c.includes('infantil') || c.includes('desenho')) return '🎨';
      return '📺';
    }

    function renderView() {
      const container = document.getElementById('mainContainer');
      updateFavoriteBadge();

      if (state.searchQuery.trim().length > 0) {
        container.innerHTML = '';
        return;
      }

      if (state.activeTab === 'channels') {
        renderChannelsGroupedView(container);
      } else if (state.activeTab === 'sports') {
        renderSportsView(container);
      } else if (state.activeTab === 'categories') {
        renderCategoriesSummaryView(container);
      } else if (state.activeTab === 'favorites') {
        renderFavoritesView(container);
      }
      lucide.createIcons();
    }

    function renderChannelsGroupedView(container) {
      let filteredChannels = state.channels;
      if (state.selectedCategory !== 'all') {
        filteredChannels = state.channels.filter(c => c.category === state.selectedCategory);
      }

      const grouped = {};
      filteredChannels.forEach(ch => {
        const cat = ch.category || 'Outros';
        if (!grouped[cat]) grouped[cat] = [];
        grouped[cat].push(ch);
      });

      let html = `<div class="space-y-8">`;
      for (const [categoryName, channelsList] of Object.entries(grouped)) {
        html += `
          <section class="space-y-3">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
              <div class="flex items-center gap-2">
                <span class="text-lg">${getCategoryIcon(categoryName)}</span>
                <h2 class="text-lg font-bold text-white tracking-tight">${categoryName}</h2>
                <span class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-indigo-400 font-bold border border-slate-700">${channelsList.length}</span>
              </div>
              ${state.selectedCategory === 'all' ? `
                <button onclick="filterCategory('${categoryName}')" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium flex items-center gap-1">
                  Isolar categoria <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                </button>
              ` : ''}
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
              ${channelsList.map(ch => createChannelCardHtml(ch)).join('')}
            </div>
          </section>
        `;
      }
      html += `</div>`;
      container.innerHTML = html;
    }

    function createChannelCardHtml(channel) {
      const isFav = state.favorites.some(f => f.id === channel.id);
      const epg = channel.epg?.current;

      return `
        <div class="bg-slate-900 border border-slate-800 hover:border-indigo-500/50 rounded-xl p-4 transition-all duration-200 hover:shadow-xl flex flex-col justify-between group relative">
          <div>
            <div class="flex items-start justify-between gap-3 mb-3">
              <div class="flex items-center gap-3">
                <img src="${channel.logo_url || 'https://via.placeholder.com/48'}" alt="${channel.name}" class="w-10 h-10 rounded-lg object-contain bg-slate-950 p-1 border border-slate-800" onerror="this.src='https://via.placeholder.com/48?text=TV'">
                <div>
                  <h3 class="font-bold text-white text-sm group-hover:text-indigo-400 transition-colors line-clamp-1">${channel.name}</h3>
                  <span class="text-[10px] text-slate-400 font-medium">${channel.category || 'Geral'}</span>
                </div>
              </div>
              <button onclick="toggleFavorite('${channel.id}', event)" class="text-slate-600 hover:text-rose-500 transition p-1">
                <i data-lucide="heart" class="w-4 h-4 ${isFav ? 'text-rose-500 fill-rose-500' : ''}"></i>
              </button>
            </div>
            ${epg ? `
              <div class="bg-slate-950 rounded-lg p-2.5 border border-slate-800 mb-3 space-y-1">
                <div class="flex items-center justify-between text-[11px]">
                  <span class="text-indigo-300 font-semibold truncate flex items-center gap-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span> ${epg.title || 'No Ar'}
                  </span>
                  <span class="text-slate-500 text-[10px]">${epg.formatted_time || ''}</span>
                </div>
                ${epg.description ? `<p class="text-[10px] text-slate-400 line-clamp-1">${epg.description}</p>` : ''}
              </div>
            ` : `<p class="text-[11px] text-slate-500 italic mb-3">Sinal Online</p>`}
          </div>
          <button onclick="openPlayerModal('channel', '${channel.id}')" class="w-full py-2 px-3 rounded-lg bg-slate-800 hover:bg-indigo-600 text-slate-200 hover:text-white text-xs font-bold transition flex items-center justify-center gap-2">
            <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i> Assistir Agora
          </button>
        </div>
      `;
    }

    function renderSportsView(container) {
      container.innerHTML = `
        <div class="space-y-4">
          <h2 class="text-lg font-bold text-white flex items-center gap-2"><i data-lucide="activity" class="w-5 h-5 text-amber-400"></i> Esportes Ao Vivo</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${state.sports.map(sport => `
              <div class="bg-slate-900 border border-amber-500/40 rounded-xl p-4 flex flex-col justify-between space-y-4">
                <div class="flex items-center justify-between">
                  <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-rose-500/20 text-rose-400">● AO VIVO</span>
                  <span class="text-xs text-amber-400 font-semibold">${sport.competition || 'Futebol'}</span>
                </div>
                <h3 class="font-bold text-white text-sm">${sport.title}</h3>
                <button onclick="openPlayerModal('sport', '${sport.id}')" class="w-full py-2 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold transition flex items-center justify-center gap-2">
                  <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i> Assistir Transmissão
                </button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderCategoriesSummaryView(container) {
      container.innerHTML = `
        <div class="space-y-6">
          <h2 class="text-lg font-bold text-white">Categorias</h2>
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
            ${state.categories.map(cat => `
              <div onclick="filterCategory('${cat}'); switchTab('channels');" class="bg-slate-900 border border-slate-800 rounded-xl p-5 cursor-pointer hover:border-indigo-500 transition flex flex-col items-center text-center">
                <span class="text-3xl mb-2">${getCategoryIcon(cat)}</span>
                <h3 class="font-bold text-sm text-white">${cat}</h3>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderFavoritesView(container) {
      if (state.favorites.length === 0) {
        container.innerHTML = `<div class="text-center py-16 bg-slate-900/40 border border-slate-800 rounded-2xl"><h3 class="text-lg font-bold text-slate-300">Sem favoritos salvos</h3></div>`;
        return;
      }
      container.innerHTML = `
        <div class="space-y-4">
          <h2 class="text-lg font-bold text-white">Favoritos</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            ${state.favorites.map(ch => createChannelCardHtml(ch)).join('')}
          </div>
        </div>
      `;
    }

    function openPlayerModal(type, itemId) {
      const item = type === 'channel' ? state.channels.find(c => c.id === itemId) : state.sports.find(s => s.id === itemId);
      if (!item) return;

      state.currentPlayingItem = item;
      document.getElementById('modalTitle').innerText = item.name || item.title || 'Transmissão';
      document.getElementById('modalCategory').innerText = item.category || 'Geral';
      document.getElementById('modalLogo').src = item.logo_url || item.poster || 'https://via.placeholder.com/48?text=TV';

      const embeds = item.embeds || [];
      const serverContainer = document.getElementById('serverContainer');
      serverContainer.innerHTML = `<span class="text-xs font-medium text-slate-400">Servidores:</span>`;

      if (embeds.length > 0) {
        embeds.forEach((emb, idx) => {
          const btn = document.createElement('button');
          btn.className = `px-3 py-1 rounded text-xs font-semibold transition ${idx === 0 ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-300'}`;
          btn.innerText = `${emb.provider || 'Servidor ' + (idx + 1)}`;
          btn.onclick = () => selectServer(emb.embed_url, btn);
          serverContainer.appendChild(btn);
        });
        selectServer(embeds[0].embed_url, serverContainer.children[1]);
      }

      document.getElementById('playerModal').classList.remove('hidden');
    }

    function selectServer(url, btnElement) {
      state.activeEmbedUrl = url;
      document.getElementById('videoIframe').src = url;
      const parent = document.getElementById('serverContainer');
      Array.from(parent.querySelectorAll('button')).forEach(b => {
        b.className = 'px-3 py-1 rounded text-xs font-semibold transition bg-slate-800 text-slate-300';
      });
      if (btnElement) btnElement.className = 'px-3 py-1 rounded text-xs font-semibold transition bg-indigo-600 text-white';
    }

    function closeModal() {
      document.getElementById('playerModal').classList.add('hidden');
      document.getElementById('videoIframe').src = '';
      state.currentPlayingItem = null;
    }

    function handleModalBgClick(e) {
      if (e.target.id === 'playerModal') closeModal();
    }

    function toggleFavorite(id, event) {
      if (event) event.stopPropagation();
      const channel = state.channels.find(c => c.id === id);
      if (!channel) return;
      const idx = state.favorites.findIndex(f => f.id === id);
      if (idx > -1) state.favorites.splice(idx, 1);
      else state.favorites.push(channel);
      localStorage.setItem('rdc_favorites', JSON.stringify(state.favorites));
      renderView();
    }

    function toggleCurrentModalFavorite() {
      if (!state.currentPlayingItem) return;
      toggleFavorite(state.currentPlayingItem.id);
    }

    function updateFavoriteBadge() {
      document.getElementById('favCountBadge').innerText = state.favorites.length;
    }

    function copyEmbedCode() {
      if (!state.activeEmbedUrl) return;
      const iframeCode = `<iframe src="${state.activeEmbedUrl}" width="100%" height="480" frameborder="0" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>`;
      navigator.clipboard.writeText(iframeCode).then(() => {
        const textSpan = document.getElementById('copyEmbedText');
        textSpan.innerText = "Copiado!";
        setTimeout(() => { textSpan.innerText = "Copiar Embed"; }, 2000);
      });
    }

    let searchDebounceTimer;
    function handleSearch(query) {
      clearTimeout(searchDebounceTimer);
      state.searchQuery = query;
      const clearBtn = document.getElementById('clearSearchBtn');
      if (query.trim().length > 0) clearBtn.classList.remove('hidden');
      else {
        clearBtn.classList.add('hidden');
        document.getElementById('searchResultsSection').classList.add('hidden');
        renderView();
        return;
      }
      searchDebounceTimer = setTimeout(() => executeGlobalSearch(query.trim()), 300);
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      state.searchQuery = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      document.getElementById('searchResultsSection').classList.add('hidden');
      renderView();
    }

    function executeGlobalSearch(q) {
      const resultsSection = document.getElementById('searchResultsSection');
      const resultsGrid = document.getElementById('searchResultsGrid');
      document.getElementById('searchQueryTerm').innerText = q;
      resultsSection.classList.remove('hidden');

      const lowerQ = q.toLowerCase();
      const matchedChannels = state.channels.filter(c => c.name.toLowerCase().includes(lowerQ));
      document.getElementById('searchResultCount').innerText = `${matchedChannels.length} Encontrados`;

      resultsGrid.innerHTML = matchedChannels.length === 0 
        ? `<div class="col-span-full py-10 text-center text-slate-500">Nenhum resultado para "${q}".</div>`
        : matchedChannels.map(ch => createChannelCardHtml(ch)).join('');
      lucide.createIcons();
    }
  </script>
</body>
</html>
